name: Validate skill and reusable starter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_repository.py
      - run: python3 scripts/new_episode.py --out "$RUNNER_TEMP/brother-pan-demo"
      - run: npm ci --ignore-scripts --prefix "$RUNNER_TEMP/brother-pan-demo"
      - run: npm run check --prefix "$RUNNER_TEMP/brother-pan-demo"
      - run: node tests/captions.test.cjs "$RUNNER_TEMP/brother-pan-demo/node_modules"
